# CD pipeline tasks for the Accounts microservice (kind reference run)
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: lint-code
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.9
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing flake8..."
        pip install flake8
        echo "Running flake8 (fatal errors)..."
        flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "Running flake8 (complexity/style)..."
        flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-tests
spec:
  workspaces:
    - name: source
  steps:
    - name: nose
      image: python:3.9
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "postgresql://postgres:postgres@postgres:5432/postgres"
      script: |
        #!/bin/sh
        set -e
        echo "Installing dependencies..."
        pip install -r requirements.txt
        echo "Running nosetests..."
        nosetests -v --with-spec --spec-color --with-coverage --cover-package=service
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-image
spec:
  workspaces:
    - name: source
  params:
    - name: image-tag
      description: Tag recorded for the built image tarball
      type: string
      default: "accounts:latest"
  steps:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:v1.23.2
      workingDir: $(workspaces.source.path)
      args:
        - --dockerfile=$(workspaces.source.path)/Dockerfile
        - --context=$(workspaces.source.path)
        - --no-push
        - --tarPath=$(workspaces.source.path)/image.tar
        - --destination=$(params.image-tag)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-app
spec:
  workspaces:
    - name: source
  steps:
    - name: kubectl
      image: bitnami/kubectl:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Deploying Accounts manifests..."
        kubectl apply -f $(workspaces.source.path)/deploy/deployment.yaml
        kubectl apply -f $(workspaces.source.path)/deploy/service.yaml
        kubectl rollout status deployment/accounts
        kubectl get deployment,pods,replicasets,service -l app=accounts
